<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1917">
<title>Herbário — Acervo Botânico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{
  /* --- paleta ---------------------------------------------------------
     fundo: verde militar profundo, levemente quente
     acentos suavizados um grau para acolher em vez de alarmar          */
  --breu:#1A1917; --carvao:#252220; --carvao2:#302C29;
  --linha:#343029; --linha2:#4A433B;
  --marfim:#F0EBE3; --cinza:#9B9288;
  /* três acentos sobre a base cinza-quente, só em detalhes e menus */
  --seiva:#86A45E;        /* verde     — tenho      */
  --seiva-txt:#9EBA79;
  --ambar:#D2A03C;        /* mostarda  — acabando   */
  --brasa:#C4492F;        /* vermelho  — falta      */
  --rosa:#DE8FA0;         /* rosa      — preferidas */
  --brasa-luz:#E08A72;    /* vermelho clareado, para texto sobre o escuro */
  --escuro:#1A1917;       /* texto sobre preenchimentos claros */
  --claro:#FBF2EE;        /* texto sobre o vermelho */
  --quente:#A85A3C;       /* vermelho terroso — erva quente */
  --morna:#C9A227;        /* amarelo ouro     — erva morna  */
  --sans:"Articulat CF","ArticulatCF","Articulat","Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --serif:var(--sans); --mono:var(--sans);
  --r:18px;   /* raio grande, cantos macios */
  --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--breu)}
body{margin:0;background:var(--breu);color:var(--marfim);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--seiva);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--mono)}
svg{flex:0 0 auto}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:12px;height:12px;stroke-width:1.8}
.ico-lg{width:21px;height:21px;stroke-width:1.5}

/* ============ cabeçalho ============ */
.capa{padding:16px 18px 2px}
.top{position:sticky;top:0;z-index:20;background:var(--breu);border-bottom:1px solid var(--linha)}
.top-in{padding:10px 18px 0}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--cinza)}
h1{font-family:var(--sans);font-weight:600;font-size:27px;line-height:1;margin:6px 0 0;
  letter-spacing:-.028em}
h1 em{font-style:normal;color:var(--cinza)}

.barra{display:flex;gap:2px;height:5px;margin:12px 0 8px;background:var(--carvao);
  border-radius:99px;overflow:hidden;padding:0}
.barra i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.b-cheio{background:var(--seiva)} .b-acab{background:var(--ambar)} .b-falta{background:var(--brasa)}
.legenda{display:flex;flex-wrap:wrap;gap:7px}
.legenda span{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;
  background:var(--carvao);font-size:10px;font-weight:500;letter-spacing:.02em;color:var(--cinza)}
.legenda b{font-weight:600}
.legenda span::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.l-cheio{color:var(--seiva-txt)!important} .l-acab{color:var(--ambar)!important}
.l-falta{color:var(--brasa-luz)!important}

.campo{display:flex;align-items:center;gap:9px;margin-top:0;padding:10px 14px;
  background:var(--carvao);border-radius:99px;color:var(--cinza)}
.campo input{flex:1;min-width:0;border:0;background:transparent;color:var(--marfim);
  font-family:var(--sans);font-size:15.5px}
.campo input::placeholder{color:var(--cinza)}
.campo input:focus{outline:none}

.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 18px 11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;
  border-radius:99px;background:var(--carvao);font-size:12px;font-weight:500;
  color:var(--cinza);white-space:nowrap;transition:.16s}
.chip[aria-pressed="true"]{background:var(--marfim);color:var(--breu);font-weight:600}
.chip[aria-pressed="false"][data-cor="cheio"] svg{color:var(--seiva)}
.chip[aria-pressed="false"][data-cor="acabando"] svg{color:var(--ambar)}
.chip[aria-pressed="false"][data-cor="falta"] svg{color:var(--brasa-luz)}

/* ---- filtro por trono / orixá ---- */
.linhaFiltro{display:none}
.btnTrono{gap:6px}
.btnTrono .seta{width:9px;height:9px}
.btnTrono[data-ativo="1"]{background:var(--seiva);color:var(--escuro);font-weight:600}
.btnTrono .seta{width:9px;height:9px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.limpar{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--brasa-luz);white-space:nowrap;flex:0 0 auto}
.limpar[hidden]{display:none}

/* ============ lista ============ */
main{min-height:60vh;padding:0 14px}
.letra{display:flex;align-items:center;gap:10px;padding:16px 4px 8px}
.letra span{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
  padding:0 7px;border-radius:99px;background:var(--carvao);font-size:12.5px;font-weight:600;
  letter-spacing:-.01em;color:var(--marfim)}
.letra i{flex:1;height:1px;background:var(--linha)}
.letra em{font-style:normal;font-size:10px;font-weight:500;color:var(--cinza);letter-spacing:.08em}

.linha{position:relative;display:block;margin-bottom:9px;padding:15px 15px 13px 18px;
  background:var(--carvao);border-radius:var(--r);overflow:hidden;transition:background .16s}
.linha::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;height:auto;
  border-radius:0 99px 99px 0;background:transparent;transition:background .25s}
.linha[data-nv="3"]::before{background:var(--seiva)}
.linha[data-nv="2"]::before{background:var(--ambar)}
.linha[data-nv="1"]::before{background:var(--brasa)}
.linha[data-nv="1"]{background:#2C2320}
.linha[data-nv="3"]{background:#22241C}

.info{display:block;text-align:left;width:100%;background:none;border:0;padding:0}
.cab{display:flex;align-items:baseline;gap:12px}
.nome{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-.018em;
  color:var(--marfim);line-height:1.25}
.linha[data-nv="0"] .nome{font-weight:500;color:#D3CEC6}
.vb{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;color:#8B9279;font-size:9px;
  font-weight:600;letter-spacing:.11em;text-transform:uppercase}
.info:active .vb{color:var(--marfim)}

.sub{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-top:8px;font-size:10px;line-height:1}
.bl{display:inline-flex;align-items:center;gap:7px;padding:0 10px}
.bl:first-child{padding-left:0}
.bl+.bl{border-left:1px solid var(--linha2)}
.tp{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:9.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase}
.tp.q{color:var(--quente)} .tp.m{color:var(--morna)}
.ox{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.07em}
.se{display:inline-flex}
.sel-banho{color:#8FB6C4} .sel-nota{color:var(--cinza)} .sel-alerg{color:var(--brasa-luz)}
.match{display:flex;align-items:center;gap:6px;margin-top:9px;padding:6px 11px;border-radius:9px;
  background:rgba(210,160,60,.13);color:var(--ambar);font-size:10.5px;font-weight:500;line-height:1.35}
.match svg{flex:0 0 auto}

/* grade de controles, em linha, ocupando a largura do cartão */
.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.06)}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:52px;border-radius:13px;background:rgba(0,0,0,.22);color:#8A917A;transition:.16s ease}
.nv svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv u{text-decoration:none;font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  line-height:1}
.nv-3[aria-pressed="true"]{background:var(--seiva);color:var(--escuro)}
.nv-2[aria-pressed="true"]{background:var(--ambar);color:var(--escuro)}
.nv-1[aria-pressed="true"]{background:var(--brasa);color:var(--claro)}
.nv[aria-pressed="true"] svg{stroke-width:2.1}
.nv-fav{background:transparent;box-shadow:inset 0 0 0 1px var(--linha2)}
.nv-fav svg{width:20px;height:20px}
.nv-fav[aria-pressed="true"]{background:rgba(222,143,160,.12);box-shadow:inset 0 0 0 1px var(--rosa);
  color:var(--rosa)}
.nv-fav[aria-pressed="true"] svg{fill:currentColor;stroke-width:1.4}
.nv-tira{color:var(--brasa-luz)}
.nv-compacto{height:44px;width:44px;border-radius:13px}
.chip[aria-pressed="false"][data-cor="fav"] svg{color:var(--rosa)}
.btn-add{background:var(--seiva);color:var(--escuro);letter-spacing:.06em}
.btn-fav{margin-top:9px;background:var(--carvao);color:var(--cinza)}
.btn-fav[aria-pressed="true"]{color:var(--rosa)}
.btn-fav[aria-pressed="true"] svg{fill:currentColor}

.linha.banho{display:flex;align-items:center;gap:10px}
.linha.banho .info{flex:1;min-width:0}

/* ============ painel de tronos ============ */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(13,12,11,.78);backdrop-filter:blur(5px);
  display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-height:86vh;overflow-y:auto;background:var(--breu);
  border-radius:26px 26px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--breu);padding:20px 18px 13px;
  display:flex;align-items:center;gap:10px}
.sheet-top h3{flex:1;font-size:20px;font-weight:600;letter-spacing:-.022em;margin:0}
.sheet-top button{width:34px;height:34px;border-radius:50%;background:var(--carvao);
  display:flex;align-items:center;justify-content:center;color:var(--cinza);font-size:0}
.sheet-dica{margin:0;padding:0 18px 6px;font-size:12.5px;color:var(--cinza)}

.trono{margin:8px 14px;padding:15px 15px 16px;background:var(--carvao);border-radius:var(--r);
  transition:.16s}
.trono[data-ativo="1"]{background:var(--carvao2)}
.trono-cab{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.trono-cab .el{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;color:var(--cinza)}

.trono-cab .txt{flex:1;min-width:0}
.trono-cab h4{font-size:16px;font-weight:600;letter-spacing:-.016em;margin:0;color:var(--marfim)}
.trono-cab u{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;margin-top:3px;line-height:1.4}
.trono-cab i{display:none}
.trono-cab em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--cinza)}
.trono-cab .mk{display:none}
.orixas{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.oq{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
  background:rgba(255,255,255,.05);font-size:12.5px;font-weight:500;color:var(--cinza);transition:.15s}
.oq em{font-style:normal;font-size:9.5px;font-weight:600;opacity:.7}
.oq[aria-pressed="true"]{font-weight:600}

.sheet-pe{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;
  padding:13px 18px calc(13px + env(safe-area-inset-bottom));background:var(--breu);
  border-top:1px solid var(--linha)}
.sheet-pe span{flex:1;font-size:11.5px;font-weight:500;color:var(--cinza)}
.sheet-pe button{font-size:11.5px;font-weight:600;color:var(--brasa-luz)}
.sheet-pe button[hidden]{display:none}
.sheet-pe .ver{padding:10px 18px;border-radius:99px;background:var(--seiva);color:var(--escuro)}

/* ============ comprar ============ */
.alerta{margin:12px 14px 0;padding:12px 15px;background:rgba(196,73,47,.16);
  border-radius:var(--r2);font-size:11.5px;font-weight:500;color:var(--brasa-luz);text-align:center;
  box-shadow:inset 0 0 0 1px rgba(196,73,47,.4)}
.alerta[hidden]{display:none}
.abertura{padding:22px 4px 4px}
.abertura h2{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:600;
  letter-spacing:-.024em;margin:0;line-height:1.1}
.abertura p{margin:8px 0 0;font-size:13.5px;color:var(--cinza)}
.recorte{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:14px;
  padding:12px 14px;background:rgba(210,160,60,.13);border-radius:var(--r2)}
.recorte span{flex:1;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;
  color:var(--ambar)}
.recorte button{font-size:10.5px;font-weight:600;color:var(--cinza);white-space:nowrap}
.grupo{display:flex;align-items:center;gap:9px;padding:24px 4px 10px}
.grupo h3{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin:0;font-weight:600}
.g-falta h3{color:var(--brasa-luz)} .g-acab h3{color:var(--ambar)}
.grupo i{flex:1;height:1px;background:var(--linha)}
.grupo em{font-style:normal;font-size:10px;font-weight:500;color:var(--cinza)}

.acao{padding:24px 0 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;
  border-radius:99px;font-size:14.5px;font-weight:600;letter-spacing:-.008em}
.btn-urg{background:var(--brasa);color:var(--claro)}
.btn-urg:active{background:#A93B24}
.btn-sec{margin-top:9px;background:var(--carvao);color:var(--cinza)}
.saida{display:none;margin:11px 0 0;width:100%;height:200px;padding:14px;border:0;
  border-radius:var(--r2);background:var(--carvao);color:var(--marfim);
  font-family:var(--sans);font-size:12.5px;line-height:1.65;resize:vertical}

.vazio{padding:56px 26px;text-align:center}
.vazioIco{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:var(--carvao);
  display:flex;align-items:center;justify-content:center;color:var(--cinza)}
.vazio strong{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.vazio span{font-size:13.5px;color:var(--cinza);line-height:1.6}
.rodape{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:22px 10px 26px;font-size:10.5px;font-weight:500;color:var(--cinza);text-align:center}

.backup{margin:6px 0 34px;padding:17px;background:var(--carvao);border-radius:var(--r)}
.backup h4{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--cinza);margin:0 0 8px;font-weight:600}
.backup h4 svg{color:var(--seiva)}
.backup p{margin:0 0 13px;font-size:12.5px;color:var(--cinza);line-height:1.55}
.backup .btn{padding:12px;font-size:13px;background:rgba(255,255,255,.06)}
.cola{width:100%;margin:9px 0;padding:12px;border:0;border-radius:var(--r2);
  background:rgba(0,0,0,.22);color:var(--marfim);font-family:var(--sans);font-size:12px;resize:vertical}
.cola::placeholder{color:#736A61}

/* ============ ficha ============ */
.ficha-cab{padding:4px 18px 4px}
.ficha-cab h3{font-size:25px;font-weight:600;letter-spacing:-.026em;margin:0;line-height:1.1}
.ficha-est{display:inline-flex;margin-right:6px;align-items:center;gap:6px;margin:9px 0 0;padding:5px 11px;
  border-radius:99px;background:var(--carvao);font-size:10.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--cinza)}
.ficha-est.est-3{color:var(--seiva-txt)} .ficha-est.est-2{color:var(--ambar)}
.ficha-est.est-1{color:var(--brasa-luz)}
.bloco{margin:12px 14px;padding:16px 16px 16px 18px;background:var(--carvao);
  border-radius:var(--r);overflow:hidden}
.bloco-cab{display:flex;align-items:center;gap:10px}
.bloco-cab .el{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;color:var(--cinza)}
.bloco-cab h4{flex:1;font-size:17px;font-weight:600;letter-spacing:-.018em;margin:0}

.bloco-cab .tmp{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  background:rgba(255,255,255,.05);font-size:9.5px;font-weight:600;letter-spacing:.1em}
.bloco-cab .q{color:var(--quente)} .bloco-cab .m{color:var(--morna)}
.bloco-tr{margin:9px 0 0;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cinza)}
.verbos{margin:13px 0 0;font-size:17px;font-weight:200;line-height:1.9;letter-spacing:.004em;
  color:var(--marfim)}
.ficha-pe{display:flex;gap:10px;margin:0;padding:6px 18px 30px;font-size:12.5px;line-height:1.6;
  color:var(--cinza)}

/* ---- itens do banho ---- */
.alvos{display:flex;gap:8px;padding:16px 0 4px}
.alvo{flex:1;padding:13px 6px;border-radius:var(--r);background:var(--carvao);text-align:center;
  color:var(--cinza);transition:.16s}
.alvo b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1}
.alvo u{display:block;text-decoration:none;font-size:9.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;margin-top:3px;opacity:.8}
.alvo[aria-pressed="true"]{background:var(--marfim);color:var(--escuro)}
.contagem{display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:11px 14px;
  border-radius:var(--r2);background:var(--carvao);font-size:12.5px;color:var(--cinza)}
.contagem b{font-size:14px;font-weight:600;color:var(--marfim)}
.contagem[data-situacao="ok"]{background:rgba(134,164,94,.15);color:var(--seiva-txt)}
.contagem[data-situacao="ok"] b{color:var(--seiva-txt)}
.contagem[data-situacao="excesso"]{background:rgba(210,160,60,.14);color:var(--ambar)}
.contagem[data-situacao="excesso"] b{color:var(--ambar)}
.resumo{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.resumo span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
  background:var(--carvao);font-size:10.5px;font-weight:500;color:var(--cinza)}
.resumo .rq{color:var(--quente)} .resumo .rm{color:var(--morna)} .resumo .rf{color:var(--brasa-luz)}
.nv-tira{color:var(--brasa-luz)}
.nv-fav{width:32px;height:32px;border-radius:50%}
.nv-fav[aria-pressed="true"]{color:var(--rosa)}
.nv-fav[aria-pressed="true"] svg{fill:currentColor;stroke-width:1.4}
.chip[aria-pressed="false"][data-cor="fav"] svg{color:var(--rosa)}
.btn-add{background:var(--seiva);color:var(--escuro);letter-spacing:.06em}
.btn-fav{margin-top:9px;background:var(--carvao);color:var(--cinza)}
.btn-fav[aria-pressed="true"]{color:var(--rosa)}
.btn-fav[aria-pressed="true"] svg{fill:currentColor}
.selo{display:inline-flex;vertical-align:-2px;margin-left:6px}
.sel-banho{color:#8FB6C4} .sel-nota{color:var(--cinza)} .sel-alerg{color:var(--brasa-luz)}
.badge.dis{background:var(--morna);color:var(--escuro)}

/* ---- verbos clicáveis ---- */
.verbos{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
.vchip{padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.05);
  color:var(--marfim);font-size:15px;font-weight:200;letter-spacing:.004em;line-height:1.2;
  transition:.15s}

/* ---------- cor de cada trono ----------
   tons médios e pouco saturados: distinguem categoria sem competir
   com o vermelho/mostarda/verde do estado, que são mais vivos      */
/* cor de cada trono conforme a Mandala dos Orixás (Saraceni) */
const COR_TRONO = {};
TRONOS.forEach(t=>{ COR_TRONO[t.c] = t.cor; });

const rgba = (hex, a) => "rgba("+parseInt(hex.slice(1,3),16)+","+parseInt(hex.slice(3,5),16)

const CHAVE = "ervas:estoque";
const CHAVE_ANTIGA = "estoque_ervas_cabana_v1";

/* ---------- persistência ---------- */
function avisar(msg){
  const a = document.getElementById("alerta");
  if(!msg){ a.hidden = true; return; }
  a.textContent = msg; a.hidden = false;
}
function aplicar(txt){
  const d = (typeof txt === "string") ? JSON.parse(txt) : txt;
  if(!d || typeof d.status!=="object") throw new Error("formato inválido");
  /* lê o que existir e completa o que faltar: registros gravados por
     versões anteriores continuam válidos e nada é descartado */
  estado.status     = d.status || {};
  estado.notas      = (d.notas && typeof d.notas==="object") ? d.notas : {};
  estado.banho      = Array.isArray(d.banho) ? d.banho : [];
  estado.favoritas  = Array.isArray(d.favoritas) ? d.favoritas : [];
  estado.alergias   = Array.isArray(d.alergias) ? d.alergias : [];
  estado.verbos     = Array.isArray(d.verbos) ? d.verbos : [];
  estado.receitas   = Array.isArray(d.receitas) ? d.receitas : [];
  estado.alvoV      = [1,3,5,7].includes(d.alvoV) ? d.alvoV : 3;
  estado.alvo       = [1,3,5,7].includes(d.alvo) ? d.alvo : 7;
  estado.atualizado = d.atualizado || null;
}

/* ---------------------------------------------------------------
   Três lugares possíveis para gravar, testados em ordem. Aberto no
   navegador do aparelho, o primeiro funciona e o registro é real.
   Dentro do aplicativo do Claude, nenhum costuma funcionar — daí o
   aviso e o código de registro.
   --------------------------------------------------------------- */
const COFRES = [
  { nome:"navegador",
    ler:  ()=> window.localStorage.getItem(CHAVE),
    grav: v => window.localStorage.setItem(CHAVE, v) },
  { nome:"sessão",
    ler:  ()=> window.sessionStorage.getItem(CHAVE),
    grav: v => window.sessionStorage.setItem(CHAVE, v) },
  { nome:"aplicativo",
    ler:  async()=>{ const r = await window.storage.get(CHAVE, false); return r && r.value; },
    grav: async v => { await window.storage.set(CHAVE, v, false); } },
];
let cofre = null;

async function carregar(){
  for(const c of COFRES){
    try{
      const v = await c.ler();
      if(v){ aplicar(v); cofre = c; break; }
    }catch(e){ /* indisponível, tenta o próximo */ }
  }
  if(!cofre) await testarCofres();
  render();
}

/* descobre, sem dados salvos, qual cofre aceita escrita e releitura */
async function testarCofres(){
  for(const c of COFRES){
    try{
      await c.grav('{"teste":1}');
      const v = await c.ler();
      if(v){ cofre = c; salvoOk = true; return; }
    }catch(e){ /* segue */ }
  }
  salvoOk = false;
}

async function gravar(){
  const carga = JSON.stringify(estado);
  const ordem = cofre ? [cofre, ...COFRES] : COFRES;
  for(const c of ordem){
    try{
      await c.grav(carga);
      const v = await c.ler();
      if(v){ cofre = c; salvoOk = true; avisar(null); return true; }
    }catch(e){ /* segue */ }
  }
  salvoOk = false;
  return false;
}

function salvar(){
  clearTimeout(pendente);
  pendente = setTimeout(async ()=>{
    estado.atualizado = new Date().toISOString();
    const ok = await gravar();
    if(!ok) avisar("Rodando aqui dentro, o herbário não consegue gravar. Baixe o arquivo e abra no Safari — ou guarde o código do registro antes de fechar.");
    render();
  }, 450);
}

/* ---------- dados ---------- */
const sacode = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

/* índice de busca por verbo: reúne os verbos de todos os pares
   (orixá, temperatura) em que a erva aparece */
const IDX = {};
DADOS.forEach(e=>{
  const vs = [];
  e.p.forEach(([cod,t])=>{
    ((VERBOS[cod]||{})[t]||[]).forEach(v=>{ if(!vs.includes(v)) vs.push(v); });
  });
  const os = e.o.map(c=>(ORIXAS[c]||c)+" "+c).join(" ");
  IDX[e.n] = { v: vs, k: sacode(vs.join(" ")), o: sacode(os) };
});
const termo = () => sacode(busca.trim());

const nivelDe = n => estado.status[n] || 0;
const ICONE = {
  3: sv(D.visto), 2: sv(D.aviso), 1: sv(D.carrinho)
};
const ROTULO = {3:"tenho",2:"acabando",1:"a repor"};
function contar(){ const c={3:0,2:0,1:0,0:0}; DADOS.filter(passaVibra).forEach(e=>c[nivelDe(e.n)]++); return c; }
function filtrada(){
  const b = termo();
  return DADOS.filter(e=>{
    if(b && !e.k.includes(b) && !IDX[e.n].k.includes(b) && !IDX[e.n].o.includes(b)) return false;
    if(!passaVibra(e)) return false;
    const nv = nivelDe(e.n);
    if(filtro==="cheio")   return nv===3;
    if(filtro==="acabando")return nv===2;
    if(filtro==="falta")   return nv===1;
    if(filtro==="fav")     return ehFavorita(e.n);
    if(filtro==="Q")       return e.t.includes("Q");
    if(filtro==="M")       return e.t.includes("M");
    return true;
  });
}
function orixasDoTrono(c){ const t = TRONOS.find(x=>x.c===c); return t ? t.orixas : []; }
function tronoDeOrixa(cod){ return TRONOS.find(t=>t.orixas.includes(cod)); }
function corOrixa(cod){ const t = tronoDeOrixa(cod); return (t && COR_TRONO[t.c]) || "#9B9288"; }
/* união: a erva entra se pertencer a QUALQUER trono ou orixá selecionado */
function alvosVibra(){
  const set = new Set(selOrixas);
  selTronos.forEach(c=>orixasDoTrono(c).forEach(o=>set.add(o)));
  return set;
}
function passaVibra(e){
  if(!selTronos.size && !selOrixas.size) return true;
  const alvos = alvosVibra();
  return e.o.some(c=>alvos.has(c));
}
function totalVibra(){ return DADOS.filter(passaVibra).length; }
function rotuloVibra(){
  const n = [...selTronos].map(c=>{ const t=TRONOS.find(x=>x.c===c);
              return t.n!=="—" ? t.n+" trono, da "+t.nome : t.nome; })
            .concat([...selOrixas].map(c=>ORIXAS[c]||c));
  if(!n.length) return null;
  return n.length===1 ? n[0] : n.slice(0,-1).join(", ")+" e "+n[n.length-1];
}

/* ---------- linha ---------- */
function linha(e){
  const nv = nivelDe(e.n);
  const div = document.createElement("div");
  div.className="linha"; div.dataset.nv = nv;

  const info = document.createElement("button"); info.className="info";
  info.setAttribute("aria-label", "Abrir a ficha de "+e.n);
  info.onclick = ()=>abrirFicha(e);
  const cab = document.createElement("div"); cab.className="cab";
  const nome = document.createElement("div"); nome.className="nome"; nome.textContent = e.n;
  const sub = document.createElement("div"); sub.className="sub";
  const temp = e.t.split("").map(t=>'<i class="tp '+(t==="Q"?"q":"m")+'">'
      + sv(t==="Q"?D.chama:D.folha,"ico-sm") + (t==="Q"?"quente":"morna") + '</i>').join("");
  const pastilhas = e.o.map(cod=>{
    const c = corOrixa(cod);
    return '<i class="ox" style="color:'+c+'" title="'+(ORIXAS[cod]||cod)+'">'+cod+'</i>';
  }).join("");
  const selos = (temAlergia(e.n) ? '<i class="se sel-alerg" title="Alergia">'+sv(D.proibido,"ico-sm")+'</i>' : "")
    + (noBanho(e.n) ? '<i class="se sel-banho" title="No banho">'+sv(D.gotas,"ico-sm")+'</i>' : "")
    + (estado.notas[e.n] ? '<i class="se sel-nota" title="Tem anotação">'+sv(D.nota,"ico-sm")+'</i>' : "");
  sub.innerHTML = '<span class="bl bl-tp">'+temp+'</span>'
    + '<span class="bl bl-ox">'+pastilhas+'</span>'
    + (selos ? '<span class="bl bl-se">'+selos+'</span>' : "")
    ;
  sub.title = e.o.map(c=>ORIXAS[c]||c).join(", ");
  const vb = document.createElement("span"); vb.className="vb";
  vb.innerHTML = sv(D.raio,"ico-sm")+"verbos de poder";
  cab.appendChild(nome); cab.appendChild(vb);
  info.appendChild(cab); info.appendChild(sub);

  const b = termo();
  if(b && !e.k.includes(b) && !IDX[e.n].o.includes(b)){
    const achados = IDX[e.n].v.filter(v=>sacode(v).includes(b));
    if(achados.length){
      const m = document.createElement("div"); m.className="match";
      m.innerHTML = sv(D.raio,"ico-sm")
        + achados.slice(0,4).join(" · ")
        + (achados.length>4 ? " +"+(achados.length-4) : "");
      info.appendChild(m);
    }
  }

  const acoes = document.createElement("div"); acoes.className="acoes";
  const niveis = document.createElement("div"); niveis.className="niveis";
  [3,2,1].forEach(n=>{
    const b=document.createElement("button");
    b.className="nv nv-"+n;
    b.setAttribute("aria-pressed", nv===n);
    b.setAttribute("aria-label", e.n+": marcar como "+ROTULO[n]);
    b.title = ROTULO[n];
    b.innerHTML = ICONE[n] + '<u>' + {3:"tenho",2:"acabando",1:"repor"}[n] + '</u>';
    b.onclick = ()=>{
      if(nivelDe(e.n)===n) delete estado.status[e.n]; else estado.status[e.n]=n;
      salvar(); render();
    };
    niveis.appendChild(b);
  });

  const fav = document.createElement("button");
  fav.className = "nv nv-fav";
  fav.setAttribute("aria-pressed", ehFavorita(e.n));
  fav.setAttribute("aria-label", (ehFavorita(e.n)?"Tirar ":"Marcar ")+e.n+" como preferida");
  fav.title = "Preferida";
  fav.innerHTML = sv(D.coracao);
  fav.onclick = ()=>alternaFavorita(e.n);

  [...niveis.children].forEach(b=>acoes.appendChild(b));
  acoes.appendChild(fav);
  div.appendChild(info); div.appendChild(acoes);
  return div;
}

/* ---------- telas ---------- */
function telaEstoque(alvo){
  const lista = filtrada();
  if(!lista.length){
    alvo.innerHTML = '<div class="vazio"><div class="vazioIco">'+sv(D.lupa,"ico-lg")+'</div><strong>Nenhuma erva aqui</strong>'
      + '<span>Nenhuma erva combina os filtros ativos. Toque em <b>limpar</b> ou ajuste a busca.</span></div>';
    return;
  }
  let letra = "";
  lista.forEach(e=>{
    const L = e.k[0].toUpperCase();
    if(L!==letra){
      letra = L;
      const n = lista.filter(x=>x.k[0].toUpperCase()===L).length;
      const h = document.createElement("div"); h.className="letra";
      h.innerHTML = "<span>"+L+"</span><i></i><em>"+n+"</em>";
      alvo.appendChild(h);
    }
    alvo.appendChild(linha(e));
  });
  const p = document.createElement("div"); p.className="rodape";
  p.innerHTML = sv(!estado.atualizado ? D.folha : (salvoOk===false ? D.aviso : D.escudo),"ico-sm");
  p.appendChild(document.createTextNode(!estado.atualizado
    ? "Visto = tenho · Atenção = acabando · Carrinho = comprar"
    : (salvoOk===false ? "Gravação automática indisponível nesta sessão"
       : "Salvo neste aparelho · "+new Date(estado.atualizado).toLocaleString("pt-BR"))));
  alvo.appendChild(p);
  alvo.appendChild(painelBackup());
}

function telaComprar(alvo){
  const falta = DADOS.filter(e=>passaVibra(e) && nivelDe(e.n)===1);
  const acab  = DADOS.filter(e=>passaVibra(e) && nivelDe(e.n)===2);

  if(!falta.length && !acab.length){
    alvo.innerHTML = '<div class="vazio"><div class="vazioIco">'+sv(D.pote,"ico-lg")+'</div><strong>Nada a repor</strong>'
      + '<span>Toque no carrinho ou no sinal de atenção de uma erva no herbário e ela aparece aqui, pronta para a feira.</span></div>';
    return;
  }

  const rec = rotuloVibra();
  const ab = document.createElement("div"); ab.className="abertura";
  ab.innerHTML = "<h2>"+sv(D.carrinho,"ico-lg")+"A repor</h2><p>"
    + (falta.length ? "<b>"+falta.length+"</b> erva"+(falta.length>1?"s":"")+" para repor" : "Nada a repor")
    + (acab.length ? " e <b>"+acab.length+"</b> acabando." : ".") + "</p>";
  if(rec){
    const av = document.createElement("div"); av.className="recorte";
    av.innerHTML = '<span>'+sv(D.aviso,"ico-sm")+'Recorte ativo · '+rec+'</span><button>ver tudo</button>';
    av.querySelector("button").onclick = limparVibra;
    ab.appendChild(av);
  }
  alvo.appendChild(ab);

  const bloco = (cls, titulo, nota, arr)=>{
    if(!arr.length) return;
    const g=document.createElement("div"); g.className="grupo "+cls;
    g.innerHTML = "<h3>"+sv(cls==="g-falta"?D.carrinho:D.aviso,"ico-sm")+titulo+"</h3><i></i><em>"+nota+"</em>";
    alvo.appendChild(g);
    arr.forEach(e=>alvo.appendChild(linha(e)));
  };
  bloco("g-falta","A repor", "não tenho no herbário", falta);
  bloco("g-acab","Acabando", "dá para um banho, não para dois", acab);

  const texto = "HERBÁRIO — ACERVO BOTÂNICO · a repor\n"
    + new Date().toLocaleDateString("pt-BR") + "\n"
    + (rec ? "Recorte: "+rec+" (lista parcial)\n" : "")
    + "\n"
    + (falta.length ? "A REPOR ("+falta.length+")\n" + falta.map(e=>"— "+e.n+"  ["+e.t+"]").join("\n") + "\n\n" : "")
    + (acab.length ? "ACABANDO ("+acab.length+")\n" + acab.map(e=>"— "+e.n+"  ["+e.t+"]").join("\n") + "\n" : "")
    + "\nQ = quente · M = morna";

  const acao=document.createElement("div"); acao.className="acao";
  const bc=document.createElement("button"); bc.className="btn btn-urg";
  bc.innerHTML = sv(D.carrinho)+"Copiar lista de compras";
  const bv=document.createElement("button"); bv.className="btn btn-sec"; bv.textContent="Ver como texto";
  acao.appendChild(bc); acao.appendChild(bv); alvo.appendChild(acao);

  const ta=document.createElement("textarea"); ta.className="saida"; ta.readOnly=true; ta.value=texto;
  alvo.appendChild(ta);

  bc.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(texto); bc.textContent="Lista copiada"; }
    catch(err){ ta.style.display="block"; ta.select(); bc.textContent="Selecione o texto abaixo e copie"; }
    setTimeout(()=>bc.innerHTML=sv(D.carrinho)+"Copiar lista de compras", 2400);
  };
  bv.onclick = ()=>{ ta.style.display = ta.style.display==="block" ? "none" : "block"; };

  const p=document.createElement("div"); p.className="rodape";
  p.textContent="Cada erva continua editável aqui — toque no visto quando ela voltar para o herbário.";
  alvo.appendChild(p);
}

  let html = '<div class="ficha-cab"><h3>'+e.n+'</h3>'
    + '<p class="ficha-est est-'+nv+'">'+sv(ICONE_EST[nv],"ico-sm")+estadoTxt+'</p>'
    + (temAlergia(e.n) ? '<p class="ficha-alerg">'+sv(D.proibido,"ico-sm")+'Você marcou alergia a esta erva</p>' : '')
    + '</div>';

  e.p.forEach(([cod, t])=>{
    const tr = tronoDe(cod);
    const verbos = (VERBOS[cod] && VERBOS[cod][t]) || [];
    const cor = corOrixa(cod);
    html += '<div class="bloco" style="box-shadow:inset 3px 0 0 '+cor+'">'
      + '<div class="bloco-cab"><span class="el" style="color:'+cor+';background:'+rgba(cor,.16)+'">'
      + sv((tr&&ICO_EL[tr.el])||D.folha)+'</span>'
      + '<h4 style="color:'+cor+'">'+(ORIXAS[cod]||cod)+'</h4>'
      + '<span class="tmp '+(t==="Q"?"q":"m")+'">'+sv(t==="Q"?D.chama:D.folha,"ico-sm")
      + (t==="Q"?"QUENTE":"MORNA")+'</span></div>'
      + '<p class="bloco-tr">'+(tr ? (tr.n!=="—" ? tr.n+" Trono da "+tr.nome : tr.nome)
      + ' · ' + tr.el2 : '')+'</p>'
      + '<p class="verbos">'+verbos.map(v=>'<button class="vchip" data-v="'+v+'" aria-pressed="'
        + verboEscolhido(v)+'">'+v+'</button>').join("")+'</p>'
      + '</div>';
  });

  html += '<div class="ficha-acoes">'
    + '<button class="btn '+(noBanho(e.n)?"btn-sec":"btn-add")+'" id="fBanho">'
    + sv(noBanho(e.n)?D.tira:D.mais) + (noBanho(e.n)?"TIRAR DO BANHO":"ADICIONAR ERVA") + '</button>'
    + '<button class="btn btn-fav" id="fFav" aria-pressed="'+ehFavorita(e.n)+'">'
    + sv(D.coracao) + (ehFavorita(e.n)?"Preferida":"Marcar como preferida") + '</button>'
    + '</div>'
    + '<div class="ficha-nota">'
    + '<h5>'+sv(D.nota,"ico-sm")+'Minhas anotações</h5>'
    + '<p class="nota-dica">Fundamento recebido, onde encontrar a erva, preço, forma de uso.</p>'
    + '<textarea id="fNota" rows="5" placeholder="Escreva aqui…"></textarea>'
    + '<button class="alerg" id="fAlerg" aria-pressed="'+temAlergia(e.n)+'">'
    + sv(D.proibido,"ico-sm")
    + '<span>'+(temAlergia(e.n)?"Marcada como alergia":"Marcar alergia")+'</span></button>'
    + '</div>';

  html += '<p class="ficha-pe">'+sv(D.aviso)+'<span>Os verbos são da coluna do orixá na temperatura em que a erva aparece — '
        + 'não da erva isolada. Uma mesma folha muda de verbo conforme quem a reivindica.</span></p>';

  c.innerHTML = html;

  /* a ficha abre primeiro; nenhum botão ausente pode impedir isso */
  document.getElementById("ficha").hidden = false;

  c.querySelectorAll(".vchip").forEach(b=>{
    b.onclick = ()=>{ alternaVerbo(b.dataset.v); abrirFicha(e); render(); };
  });

  const liga = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  liga("fBanho", ()=>{ alternaBanho(e.n); abrirFicha(e); });
  liga("fFav",   ()=>{ alternaFavorita(e.n); abrirFicha(e); });
  liga("fAlerg", ()=>{ alternaAlergia(e.n); abrirFicha(e); render(); });

  const ta = document.getElementById("fNota");
  if(ta){
    ta.value = estado.notas[e.n] || "";
    ta.oninput = ()=>{
      const v = ta.value;
      if(v.trim()) estado.notas[e.n] = v; else delete estado.notas[e.n];
      salvar();
    };
  }

  document.querySelector("#ficha .sheet-in").scrollTop = 0;
}
function fecharFicha(){ document.getElementById("ficha").hidden = true; }

/* ---------- painel de tronos ---------- */
function contaOrixa(cod){ return DADOS.filter(e=>e.o.includes(cod)).length; }
function contaTrono(c){ const os=orixasDoTrono(c); return DADOS.filter(e=>e.o.some(x=>os.includes(x))).length; }

function pintarTronos(){
  const alvo = document.getElementById("tronos"); alvo.innerHTML="";
  TRONOS.forEach(t=>{
    const cor = COR_TRONO[t.c] || "#9B9288";
    const bl = document.createElement("div"); bl.className="trono";
    const ativo = selTronos.has(t.c);
    bl.dataset.ativo = ativo ? "1" : "0";
    bl.style.boxShadow = ativo ? "inset 0 0 0 1.5px "+cor : "none";
    bl.style.background = ativo ? rgba(cor,.12) : "";

    const cab = document.createElement("button"); cab.className="trono-cab";
    cab.setAttribute("aria-pressed", ativo);
    cab.innerHTML = '<span class="el" style="color:'+(ativo?"#1A1917":cor)+';background:'
      + (ativo?cor:rgba(cor,.16))+'">'+sv(ICO_EL[t.el]||D.folha)+'</span>'
      + '<span class="txt"><h4>'+(t.n!=="—" ? t.n+" Trono da "+t.nome : t.nome)+'</h4>'
      + '<u style="color:'+cor+'">'+t.el2+' · '+t.sentido+'</u></span>'
      + '<em>'+contaTrono(t.c)+'</em>';
    cab.onclick = ()=>{
      selTronos.has(t.c) ? selTronos.delete(t.c) : selTronos.add(t.c);
      pintarTronos(); atualizarBotao(); render();
    };
    bl.appendChild(cab);

    const os = document.createElement("div"); os.className="orixas";
    t.orixas.forEach(cod=>{
      const b=document.createElement("button"); b.className="oq";
      const dentro = selOrixas.has(cod) || selTronos.has(t.c);
      b.setAttribute("aria-pressed", dentro);
      b.style.color = dentro ? "#1A1917" : cor;
      b.style.background = dentro ? cor : rgba(cor,.13);
      b.innerHTML = (ORIXAS[cod]||cod)+"<em>"+contaOrixa(cod)+"</em>";
      b.onclick = ()=>{
        if(selTronos.has(t.c)){            // sai do trono inteiro e mantém só os outros orixás dele
          selTronos.delete(t.c);
          t.orixas.forEach(o=>{ if(o!==cod) selOrixas.add(o); });
        } else {
          selOrixas.has(cod) ? selOrixas.delete(cod) : selOrixas.add(cod);
        }
        pintarTronos(); atualizarBotao(); render();
      };
      os.appendChild(b);
    });
    bl.appendChild(os);
    alvo.appendChild(bl);
  });
  const n = totalVibra(), sel = selTronos.size + selOrixas.size;
  const rodape = document.getElementById("sheetPe");
  rodape.querySelector("#sheetConta").textContent =
    sel ? n + (n===1?" erva selecionada":" ervas selecionadas") : "173 ervas — nenhum recorte";
  rodape.querySelector("#sheetLimpar").hidden = sel===0;
}
function abrirSheet(){ pintarTronos(); document.getElementById("sheet").hidden=false; }
function fecharSheet(){ document.getElementById("sheet").hidden=true; }
function atualizarBotao(){
  const b=document.getElementById("btnTrono"), t=document.getElementById("btnTronoTxt"),
        l=document.getElementById("limpar");
  const nomes = [...selTronos].map(c=>TRONOS.find(x=>x.c===c).nome)
                .concat([...selOrixas].map(c=>ORIXAS[c]||c));
  if(!nomes.length){ t.textContent="Trono / Orixá"; b.dataset.ativo="0"; l.hidden=true; return; }
  t.textContent = nomes.length<=2 ? nomes.join(" + ") : nomes.length+" recortes";
  b.dataset.ativo="1"; l.hidden=false;
}
function limparVibra(){
  selTronos.clear(); selOrixas.clear();
  atualizarBotao(); render();
  if(!document.getElementById("sheet").hidden) pintarTronos();
}

/* ---------- cópia de segurança ---------- */
function painelBackup(){
  const box = document.createElement("section"); box.className="backup";
  box.innerHTML = "<h4>"+sv(D.escudo,"ico-sm")+"Código do registro</h4>"
    + "<p>" + (salvoOk===false
        ? "Aqui dentro do aplicativo o herbário não pode gravar. <b>Baixe este arquivo, abra no Safari</b> e o registro passa a ser guardado sozinho. Enquanto isso, baixe o arquivo do registro ou copie o código antes de fechar."
        : "O registro está sendo guardado neste aparelho. Baixe o arquivo de vez em quando — é a sua cópia de segurança caso troque de telefone.") + "</p>";

  const bc = document.createElement("button");
  bc.className="btn"+(salvoOk===false?" btn-urg":" btn-sec"); bc.innerHTML=sv(D.escudo)+"Copiar meu código";
  bc.onclick = async ()=>{
    const carga = JSON.stringify(estado);
    try{ await navigator.clipboard.writeText(carga); bc.textContent="Código copiado"; }
    catch(err){ campo.value = carga; campo.select(); bc.textContent="Selecione o texto abaixo e copie"; }
    setTimeout(()=>bc.innerHTML=sv(D.escudo)+"Copiar meu código", 2400);
  };

  const campo = document.createElement("textarea");
  campo.className="cola"; campo.placeholder="Cole aqui o código guardado…"; campo.rows=3;

  const br = document.createElement("button");
  br.className="btn btn-sec"; br.textContent="Restaurar deste código";
  br.onclick = ()=>{
    try{
      aplicar(campo.value.trim());
      campo.value=""; salvar(); render();
    }catch(e){ br.textContent="Código não reconhecido"; setTimeout(()=>br.textContent="Restaurar deste código",2400); }
  };

  const bx = document.createElement("button");
  bx.className="btn btn-sec"; bx.innerHTML = sv(D.baixar)+"Baixar arquivo do registro";
  bx.onclick = ()=>{
    const blob = new Blob([JSON.stringify(estado,null,1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "herbario-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };

  const rot = document.createElement("label");
  rot.className="btn btn-sec"; rot.innerHTML = sv(D.subir)+"Abrir arquivo do registro";
  const arq = document.createElement("input");
  arq.type="file"; arq.accept="application/json,.json"; arq.style.display="none";
  arq.onchange = ()=>{
    const f = arq.files && arq.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ try{ aplicar(fr.result); salvar(); render(); }
                      catch(e){ avisar("Arquivo não reconhecido."); } };
    fr.readAsText(f);
  };
  rot.appendChild(arq);

  box.appendChild(bx); box.appendChild(rot);
  box.appendChild(bc); box.appendChild(campo); box.appendChild(br);
  return box;
}


/* ---------- itens do banho ---------- */
const noBanho = n => estado.banho.includes(n);
const ehFavorita = n => estado.favoritas.includes(n);
const temAlergia = n => estado.alergias.includes(n);
const verboEscolhido = v => estado.verbos.includes(v);
function alternaVerbo(v){
  const i = estado.verbos.indexOf(v);
  if(i>=0) estado.verbos.splice(i,1); else estado.verbos.push(v);
  salvar();
}
/* ervas que carregam algum dos verbos escolhidos, das mais aderentes às menos */
function ervasPorVerbo(){
  if(!estado.verbos.length) return [];
  return DADOS.map(e=>{
      const casam = estado.verbos.filter(v=>IDX[e.n].v.includes(v));
      return {e, n: casam.length, casam};
    })
    .filter(x=>x.n>0)
    .sort((a,b)=> b.n-a.n || a.e.k.localeCompare(b.e.k));
}
function alternaAlergia(n){
  const i = estado.alergias.indexOf(n);
  if(i>=0) estado.alergias.splice(i,1); else estado.alergias.push(n);
  salvar();
}
function alternaFavorita(n){
  const i = estado.favoritas.indexOf(n);
  if(i>=0) estado.favoritas.splice(i,1); else estado.favoritas.push(n);
  salvar(); render();
}
function alternaBanho(n){
  const i = estado.banho.indexOf(n);
  if(i>=0) estado.banho.splice(i,1); else estado.banho.push(n);
  salvar(); render();
}
function ervaPor(n){ return DADOS.find(e=>e.n===n); }

function telaBanho(alvo){
  const ab = document.createElement("div"); ab.className="abertura";
  ab.innerHTML = "<h2>"+sv(D.gotas,"ico-lg")+"Itens do banho</h2>"
    + "<p>Comece pelo verbo — o que o banho deve fazer — e depois escolha as ervas que o carregam.</p>";
  alvo.appendChild(ab);

  /* ---------- verbos do banho ---------- */
  const tv = document.createElement("div"); tv.className="secao";
  tv.innerHTML = "<h3>"+sv(D.raio,"ico-sm")+"Verbos de poder</h3>"
    + "<p>Escolha o que o banho deve fazer. As ervas vêm depois.</p>";
  alvo.appendChild(tv);

  const selV = document.createElement("div"); selV.className="alvos alvos-v";
  [1,3,5,7].forEach(n=>{
    const b=document.createElement("button");
    b.className="alvo"; b.setAttribute("aria-pressed", estado.alvoV===n);
    b.innerHTML = "<b>"+n+"</b><u>verbo"+(n>1?"s":"")+"</u>";
    b.onclick = ()=>{ estado.alvoV=n; salvar(); render(); };
    selV.appendChild(b);
  });
  alvo.appendChild(selV);

  const nv = estado.verbos.length, metaV = estado.alvoV;
  const cv = document.createElement("div"); cv.className="contagem";
  cv.dataset.situacao = nv===metaV ? "ok" : (nv<metaV ? "falta" : "excesso");
  cv.innerHTML = sv(nv===metaV ? D.visto : D.aviso,"ico-sm")
    + "<b>"+nv+" de "+metaV+"</b><span>"
    + (nv===metaV ? "intenção definida" : nv<metaV ? "faltam "+(metaV-nv) : (nv-metaV)+" além do número")
    + "</span>";
  alvo.appendChild(cv);

  if(nv){
    const lv = document.createElement("div"); lv.className="verbos-esc";
    estado.verbos.forEach(v=>{
      const b=document.createElement("button"); b.className="vchip esc"; b.setAttribute("aria-pressed","true");
      b.innerHTML = v + sv(D.x,"ico-sm");
      b.onclick = ()=>{ alternaVerbo(v); render(); };
      lv.appendChild(b);
    });
    alvo.appendChild(lv);

    const sug = ervasPorVerbo().slice(0,14);
    const sg = document.createElement("div"); sg.className="secao";
    sg.innerHTML = "<h3>"+sv(D.folha,"ico-sm")+"Ervas que atendem</h3>"
      + "<p>"+sug.length+" das mais aderentes. Toque para pôr no banho.</p>";
    alvo.appendChild(sg);

    sug.forEach(({e,n:qtd,casam})=>{
      const b = document.createElement("button");
      b.className="sugestao"; b.setAttribute("aria-pressed", noBanho(e.n));
      b.innerHTML = '<span class="sg-cab"><b>'+e.n+'</b>'
        + '<i>'+qtd+' de '+nv+'</i></span>'
        + '<span class="sg-v">'+casam.join(" · ")+'</span>'
        + '<span class="sg-ico">'+sv(noBanho(e.n)?D.visto:D.mais,"ico-sm")+'</span>';
      b.onclick = ()=>alternaBanho(e.n);
      alvo.appendChild(b);
    });
  } else {
    const d0=document.createElement("p"); d0.className="dica-vazia";
    d0.innerHTML = "Toque em <b>verbos de poder</b> no cartão de qualquer erva e escolha os verbos ali.";
    alvo.appendChild(d0);
  }

  /* ---------- ervas do banho ---------- */
  const te = document.createElement("div"); te.className="secao secao-topo";
  te.innerHTML = "<h3>"+sv(D.gotas,"ico-sm")+"Ervas do banho</h3>"
    + "<p>A composição se firma em número ímpar.</p>";
  alvo.appendChild(te);

  const sel = document.createElement("div"); sel.className="alvos";
  [1,3,5,7].forEach(n=>{
    const b=document.createElement("button");
    b.className="alvo"; b.setAttribute("aria-pressed", estado.alvo===n);
    b.innerHTML = "<b>"+n+"</b><u>erva"+(n>1?"s":"")+"</u>";
    b.onclick = ()=>{ estado.alvo=n; salvar(); render(); };
    sel.appendChild(b);
  });
  alvo.appendChild(sel);

  const n = estado.banho.length, meta = estado.alvo;
  const cont = document.createElement("div"); cont.className="contagem";
  const estadoTxt = n===meta ? "composição fechada"
                  : n<meta ? "faltam "+(meta-n)
                  : (n-meta)+" além do número";
  cont.dataset.situacao = n===meta ? "ok" : (n<meta ? "falta" : "excesso");
  cont.innerHTML = sv(n===meta ? D.visto : D.aviso,"ico-sm")
    + "<b>"+n+" de "+meta+"</b><span>"+estadoTxt+"</span>";
  alvo.appendChild(cont);

  if(!n){
    const v=document.createElement("p"); v.className="dica-vazia";
    v.innerHTML = "Nenhuma erva escolhida ainda. Use as sugestões acima ou o botão <b>ADICIONAR ERVA</b> na ficha de cada erva.";
    alvo.appendChild(v);
    blocoHistorico(alvo);
    return;
  }

  /* resumo vibratório da composição */
  let q=0, m=0; const tron=[], faltando=[];
  estado.banho.forEach(nome=>{
    const e = ervaPor(nome); if(!e) return;
    if(e.t.includes("Q")) q++;
    if(e.t.includes("M")) m++;
    e.o.forEach(c=>{ const t=tronoDeOrixa(c); if(t && !tron.includes(t.c)) tron.push(t.c); });
    if(nivelDe(nome)===1) faltando.push(nome);
  });
  const rz = document.createElement("div"); rz.className="resumo";
  rz.innerHTML = '<span class="rq">'+sv(D.chama,"ico-sm")+q+" quente"+(q!==1?"s":"")+"</span>"
    + '<span class="rm">'+sv(D.folha,"ico-sm")+m+" morna"+(m!==1?"s":"")+"</span>"
    + '<span>'+sv(D.cruz,"ico-sm")+tron.length+" trono"+(tron.length!==1?"s":"")+"</span>"
    + (faltando.length ? '<span class="rf">'+sv(D.carrinho,"ico-sm")+faltando.length+" a repor</span>" : "");
  alvo.appendChild(rz);

  estado.banho.forEach(nome=>{
    const e = ervaPor(nome); if(!e) return;
    const div = document.createElement("div");
    div.className="linha banho"; div.dataset.nv = nivelDe(nome);

    const info = document.createElement("button"); info.className="info";
    info.onclick = ()=>abrirFicha(e);
    const temp = e.t.split("").map(t=>'<i class="tp '+(t==="Q"?"q":"m")+'">'
        + sv(t==="Q"?D.chama:D.folha,"ico-sm") + (t==="Q"?"quente":"morna") + '</i>').join("");
    const past = e.o.map(cod=>{ const c=corOrixa(cod);
      return '<i class="ox" style="color:'+c+'">'+cod+'</i>'; }).join("");
    info.innerHTML = '<div class="nome">'+e.n+'</div><div class="sub">'
      + '<span class="bl bl-tp">'+temp+'</span><span class="bl bl-ox">'+past+'</span></div>';

    const bt = document.createElement("button");
    bt.className="nv nv-tira nv-compacto"; bt.setAttribute("aria-label","Tirar "+e.n+" do banho");
    bt.innerHTML = sv(D.tira);
    bt.onclick = ()=>alternaBanho(nome);

    div.appendChild(info); div.appendChild(bt);
    alvo.appendChild(div);
  });

  const texto = "ITENS DO BANHO — " + new Date().toLocaleDateString("pt-BR") + "\n"
    + estado.banho.length + " de " + estado.alvo + "\n\n"
    + estado.banho.map(nome=>{ const e=ervaPor(nome);
        return "— " + nome + (e ? "  ["+e.t+"] " + e.o.join(" ") : ""); }).join("\n");

  const acao=document.createElement("div"); acao.className="acao";
  const bc=document.createElement("button"); bc.className="btn btn-urg";
  bc.innerHTML = sv(D.gotas)+"Copiar composição";
  bc.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(texto); bc.innerHTML=sv(D.visto)+"Composição copiada"; }
    catch(err){ bc.innerHTML=sv(D.aviso)+"Não consegui copiar"; }
    setTimeout(()=>bc.innerHTML=sv(D.gotas)+"Copiar composição", 2400);
  };
  const br=document.createElement("button"); br.className="btn btn-add";
  br.innerHTML = sv(D.nota)+"REGISTRAR BANHO TOMADO";
  br.onclick = abrirRegistro;
  const bl=document.createElement("button"); bl.className="btn btn-sec";
  bl.innerHTML = sv(D.x)+"Esvaziar composição";
  bl.onclick = ()=>{ estado.banho=[]; salvar(); render(); };
  acao.appendChild(br); acao.appendChild(bc); acao.appendChild(bl);
  alvo.appendChild(acao);

  blocoHistorico(alvo);

  /* composição fechada: oferece o registro uma única vez */
  if(n===meta && meta>0){
    if(!jaOfereceu){ jaOfereceu = true; setTimeout(abrirRegistro, 450); }
  } else { jaOfereceu = false; }
}


/* ---------- registro do banho tomado ---------- */
let jaOfereceu = false;

function abrirRegistro(){
  const c = document.getElementById("regCorpo");
  const hoje = new Date().toISOString().slice(0,10);
  c.innerHTML =
      '<div class="reg-cab"><h3>Registrar banho</h3>'
    + '<p>Guarde a receita, a data e o que sentiu. Fica no seu histórico.</p></div>'
    + '<div class="reg-campo"><label for="regData">Data do banho</label>'
    + '<input type="date" id="regData" value="'+hoje+'"></div>'
    + '<div class="reg-receita"><h5>'+sv(D.gotas,"ico-sm")+'Receita</h5>'
    + (estado.verbos.length ? '<p class="reg-v">'+estado.verbos.join(" · ")+'</p>' : '')
    + '<ul>'+estado.banho.map(n=>"<li>"+n+"</li>").join("")+'</ul></div>'
    + '<div class="reg-campo"><label for="regNota">Anotações</label>'
    + '<textarea id="regNota" rows="4" placeholder="Como foi, o que sentiu, orientação recebida…"></textarea></div>'
    + '<div class="reg-acoes">'
    + '<button class="btn btn-add" id="regSalvar">'+sv(D.visto)+'SALVAR REGISTRO</button>'
    + '<button class="btn btn-sec" id="regCancelar">Agora não</button>'
    + '</div>';

  document.getElementById("registro").hidden = false;

  document.getElementById("regCancelar").onclick = fecharRegistro;
  document.getElementById("regSalvar").onclick = ()=>{
    estado.receitas.unshift({
      data: document.getElementById("regData").value || hoje,
      verbos: [...estado.verbos],
      ervas: [...estado.banho],
      nota: document.getElementById("regNota").value.trim()
    });
    salvar(); fecharRegistro(); render();
  };
}
function fecharRegistro(){ document.getElementById("registro").hidden = true; }

function blocoHistorico(alvo){
  if(!estado.receitas.length) return;
  const h = document.createElement("div"); h.className="secao secao-topo";
  h.innerHTML = "<h3>"+sv(D.nota,"ico-sm")+"Banhos registrados</h3>"
    + "<p>"+estado.receitas.length+" registro"+(estado.receitas.length>1?"s":"")+".</p>";
  alvo.appendChild(h);

  estado.receitas.forEach((r,i)=>{
    const d = document.createElement("div"); d.className="registro";
    const data = r.data ? r.data.split("-").reverse().join("/") : "";
    d.innerHTML = '<div class="rg-cab"><b>'+data+'</b><i>'+r.ervas.length+' erva'+(r.ervas.length!==1?'s':'')+'</i></div>'
      + (r.verbos.length ? '<p class="rg-v">'+r.verbos.join(" · ")+'</p>' : '')
      + '<p class="rg-e">'+r.ervas.join(", ")+'</p>'
      + (r.nota ? '<p class="rg-n">'+r.nota+'</p>' : '');
    const x = document.createElement("button"); x.className="rg-x";
    x.setAttribute("aria-label","Apagar registro de "+data);
    x.innerHTML = sv(D.x,"ico-sm");
    x.onclick = ()=>{ estado.receitas.splice(i,1); salvar(); render(); };
    d.appendChild(x);
    alvo.appendChild(d);
  });
}

/* ---------- render ---------- */
function render(){
  const c = contar(), T = DADOS.length;
  document.getElementById("barra").innerHTML =
      '<i class="b-cheio" style="width:'+(c[3]/T*100)+'%"></i>'
    + '<i class="b-acab"  style="width:'+(c[2]/T*100)+'%"></i>'
    + '<i class="b-falta" style="width:'+(c[1]/T*100)+'%"></i>';
  document.getElementById("legenda").innerHTML =
      '<span class="l-cheio"><b>'+c[3]+'</b> tenho</span>'
    + '<span class="l-acab"><b>'+c[2]+'</b> acabando</span>'
    + '<span class="l-falta"><b>'+c[1]+'</b> a repor</span>';

  const badge = document.getElementById("badge");
  const urg = c[1]+c[2];
  badge.textContent = urg; badge.hidden = urg===0;
  const bb = document.getElementById("badgeBanho");
  const tot = estado.banho.length + estado.verbos.length;
  bb.textContent = tot; bb.hidden = tot===0;

  const alvo = document.getElementById("conteudo");
  alvo.innerHTML = "";
  if(aba==="estoque") telaEstoque(alvo);
  else if(aba==="banho") telaBanho(alvo);
  else telaComprar(alvo);
}

/* ---------- eventos ---------- */
document.getElementById("busca").addEventListener("input", ev=>{ busca=ev.target.value; render(); });
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    aba=t.dataset.aba;
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
    window.scrollTo(0,0); render();
  };
});

document.getElementById("eyebrow").insertAdjacentHTML("afterbegin", sv(D.cabana,"ico-sm"));
document.getElementById("fecharSheet").onclick = fecharSheet;
document.getElementById("sheet").addEventListener("click", ev=>{ if(ev.target.id==="sheet") fecharSheet(); });
document.getElementById("limpar").onclick = limparVibra;
document.getElementById("sheetLimpar").onclick = limparVibra;
document.getElementById("sheetVer").onclick = fecharSheet;
document.getElementById("fecharFicha").onclick = fecharFicha;
document.getElementById("ficha").addEventListener("click", ev=>{ if(ev.target.id==="ficha") fecharFicha(); });
document.getElementById("registro").addEventListener("click", ev=>{ if(ev.target.id==="registro") fecharRegistro(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ fecharSheet(); fecharFicha(); fecharRegistro(); } });

pintarChips();
atualizarBotao();
carregar();
</script>
